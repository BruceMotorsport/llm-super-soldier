<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super-Soldier — Sign in</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--purple:#bc8cff;--red:#f85149}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font:14px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:380px}
  h1{font-size:18px;color:var(--purple);margin-bottom:4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
  input{width:100%;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-size:14px}
  input:focus{outline:none;border-color:var(--purple)}
  button{width:100%;background:var(--purple);color:#0d1117;border:none;border-radius:6px;padding:11px;font:inherit;font-weight:700;cursor:pointer;margin-top:18px}
  button:hover{background:#a371f7}
  .err{color:var(--red);font-size:12px;margin-top:12px;display:none}
  .hint{color:var(--dim);font-size:11px;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
  <div class="box">
    <h1>&#129408; SUPER-SOLDIER</h1>
    <div class="sub">Enter your access key</div>
    <form id="f">
      <label for="k">API KEY</label>
      <input id="k" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
      <div class="err" id="e"></div>
    </form>
    <div class="hint">
      Keys are set in <code>SS_CLIENT_KEYS</code> on the host machine.<br>
      Never paste a key into chat.
    </div>
  </div>
<script>
const $=id=>document.getElementById(id);
$('f').onsubmit=async ev=>{
  ev.preventDefault();
  const err=$('e'); err.style.display='none';
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:$('k').value})});
  if(r.ok){ location.href='/ui'; }
  else{ const j=await r.json().catch(()=>({error:'denied'}));
    err.textContent=j.error||'sign in failed'; err.style.display='block'; }
};
</script>
</body>
</html>
