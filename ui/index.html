<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super-Soldier Console</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --txt:#e6edf3; --dim:#8b949e; --green:#3fb950; --amber:#d29922;
    --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,'Cascadia Code',Consolas,monospace;padding:16px}
  h1{font-size:18px;color:var(--purple);margin-bottom:4px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .card h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:600}
  .kv{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;border-bottom:1px solid #21262d}
  .kv:last-child{border-bottom:none}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{color:var(--txt);font-weight:600}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .ok{background:var(--green)} .bad{background:var(--red)} .warn{background:var(--amber)}
  .key{padding:6px 8px;border-radius:6px;background:var(--panel2);margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .tag{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
  .t-llm{background:#3d2b5f;color:var(--purple)} .t-python{background:#1b3d2e;color:var(--green)}
  .t-cache{background:#1b3245;color:var(--blue)} .t-local{background:#3d3320;color:var(--amber)}
  #log{background:#010409;border:1px solid var(--line);border-radius:8px;padding:12px;height:340px;overflow-y:auto;font-size:13px}
  .line{margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
  .line .meta{color:var(--dim);font-size:11px}
  .you{color:var(--blue)} .sys{color:var(--dim)} .err{color:var(--red)} .okr{color:var(--green)}
  .row{display:flex;gap:8px;margin-top:10px}
  select{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;font-size:13px}
  input{flex:3;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;font-size:13px}
  input:focus,select:focus{outline:none;border-color:var(--purple)}
  button{background:var(--purple);color:#0d1117;border:none;border-radius:6px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#a371f7}
  button:disabled{opacity:.5;cursor:not-allowed}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .quick button{background:var(--panel2);color:var(--dim);font-weight:400;padding:5px 10px;font-size:11px;border:1px solid var(--line)}
  .quick button:hover{color:var(--txt);border-color:var(--purple);background:var(--panel2)}
  .hint{color:var(--dim);font-size:11px;margin-top:6px}
</style>
</head>
<body>
  <h1>&#129408; SUPER-SOLDIER CONSOLE</h1>
  <div class="sub">Answer ladder &rarr; cache &rarr; python &rarr; local &rarr; web &rarr; mcp &rarr; llm &nbsp;|&nbsp; OpenAI-compatible on <b>:8082</b></div>

  <div class="grid">
    <div class="card">
      <h2>Status</h2>
      <div id="health"><div class="kv"><span>loading</span><span>&mdash;</span></div></div>
    </div>
    <div class="card">
      <h2>Router</h2>
      <div id="router"><div class="kv"><span>loading</span><span>&mdash;</span></div></div>
    </div>
    <div class="card">
      <h2>Groq Keys</h2>
      <div id="keys"><div class="kv"><span>loading</span><span>&mdash;</span></div></div>
    </div>
    <div class="card">
      <h2>Answer Ladder</h2>
      <div id="ladder"><div class="kv"><span>loading</span><span>&mdash;</span></div></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>Console</h2>
    <div id="log"></div>
    <div class="row">
      <select id="model"></select>
      <input id="msg" placeholder="Ask anything — repeat questions are free" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="quick">
      <button data-q="What is 12 * 8?">math (free)</button>
      <button data-q="What is 28 plus 28?">words (free)</button>
      <button data-q="10 mm to cm">convert (free)</button>
      <button data-q="What is question 1?">interreference</button>
      <button data-q="Who wrote Hamlet?">needs LLM</button>
    </div>
    <div class="hint">Press Enter to send. Tag shows which rung answered &mdash; anything but <span class="tag t-python">python</span>/<span class="tag t-cache">cache</span> costs quota.</div>
  </div>

<script>
const $=id=>document.getElementById(id);
const logBox=$('log');
function log(html){const d=document.createElement('div');d.className='line';d.innerHTML=html;logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function j(u,o){
  // credentials:'same-origin' makes fetch send the session cookie.
  // Without it every chat call 401s in a browser even after login.
  try{const r=await fetch(u,{credentials:'same-origin',...(o||{})});return await r.json()}
  catch(e){return{_err:e.message}}}
function rows(el,d){
  const h=Object.entries(d).map(([k,v])=>{
    let val = v===true?'<span class="dot ok"></span>yes':v===false?'<span class="dot bad"></span>no':esc(v);
    if(typeof v==='object'&&v!==null) val='<span style="color:var(--dim)">'+esc(JSON.stringify(v))+'</span>';
    return `<div class="kv"><span>${esc(k)}</span><span>${val}</span></div>`}).join('');
  el.innerHTML=h;
}
async function tick(){
  const h=await j('/health');
  rows($('health'), h._err?{error:h._err}:{status:h.status,port:h.port,routes:(h.routes||[]).join(' → ')});
  const r=await j('/router/status');
  rows($('router'), r._err?{error:r._err}:{
    groq:r.groq_open?'OPEN (healthy)':'CLOSED (benched)',
    provider_console:r.provider_open?'OPEN (healthy)':'CLOSED (benched)',
    openrouter:r.openrouter_open?'OPEN (healthy)':'CLOSED (benched)'});
  const k=await j('/keys/stats');
  if(k.keys) $('keys').innerHTML=(k.keys||[]).map(x=>
    `<div class="key"><span>${esc(x.name)}<br><span style="color:var(--dim)">${esc(x.masked)}</span></span>
     <span style="text-align:right">${x.calls} calls<br>${x.soft_errors||0} soft &middot; ${x.errors} hard
     <span class="dot ${x.benched?'warn':'ok'}"></span></span></div>`).join('')
    +`<div class="hint">${k.keys_configured} key(s) &middot; ${k.failovers} failover(s)</div>`;
  else $('keys').innerHTML='<div class="hint">'+(k.error||'rotation disabled')+'</div>';
  const l=await j('/ladder/stats');
  rows($('ladder'), l._err?{error:l._err}:{
    cache_entries:l.cache?.entries, cache_hits:l.cache?.hits,
    python_hits:l.python_hits, local_hits:l.local_hits,
    web:(l.web_enabled?'ON':'off'), mcp:(l.mcp_enabled?'ON':'off'),
    llm_calls:l.llm_calls});
}
async function models(){
  const m=await j('/v1/models');
  const sel=$('model');
  sel.innerHTML=(m.data||[]).map(d=>`<option value="${esc(d.id)}">${esc(d.id)}</option>`).join('');
  sel.value='supersoldier';
}
async function send(){
  const t=$('msg').value.trim(); if(!t)return;
  log(`<span class="you">&#9655; ${esc(t)}</span>`);
  $('msg').value=''; $('send').disabled=true;
  const t0=performance.now();
  const r=await j('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:$('model').value,messages:[{role:'user',content:t}]})});
  $('send').disabled=false;
  if(r._err||r.error){log(`<span class="err">&#10007; ${esc(r._err||JSON.stringify(r.error))}</span>`);return}
  const txt=r.choices[0].message.content, sb=r.supersoldier||{};
  const ms=(performance.now()-t0).toFixed(0);
  log(`<span class="${sb.llm_called?'okr':'sys'}">${esc(txt)}</span>`);
  log(`<span class="meta">   ${esc(txt.length)} chars &middot; ${ms}ms &middot; <span class="tag t-${esc(sb.served_by||'?')}">${esc(sb.served_by||'?')}</span>${sb.llm_called?' &middot; LLM CALL USED':' &middot; FREE'}</span>`);
  tick();
}
$('send').onclick=send;
$('msg').onkeydown=e=>{if(e.key==='Enter')send()};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('msg').value=b.dataset.q;send()});
log('<span class="sys">Console ready. Super-Soldier answers what it can without spending quota.</span>');
tick(); models(); setInterval(tick,5000);
</script>
</body>
</html>
